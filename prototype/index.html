<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Tracker — Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">Case Tracker</div>
      <span class="badge">prototype</span>
    </div>
    <nav class="nav">
      <a href="#/cases" data-route="cases">
        <span>Board</span>
        <span class="count" id="nav-cases-count">—</span>
      </a>
      <a href="#/shifts" data-route="shifts">
        <span>Shifts</span>
        <span class="count" id="nav-shifts-count">—</span>
      </a>
      <a href="#/archive" data-route="archive">
        <span>Weekly Archive</span>
        <span class="count" id="nav-archive-count">—</span>
      </a>
      <a href="#/flow" data-route="flow">
        <span>Status Flow</span>
      </a>
    </nav>
    <div class="shift-info">
      <div class="kv">
        <span class="k">Operator</span>
        <select id="op-switcher" class="op-switcher"></select>
      </div>
      <div class="kv"><span class="k">Shift</span><span class="v" id="op-shift">—</span></div>
      <div class="kv"><span class="k">Ends</span><span class="v" id="op-ends">—</span></div>
      <div class="kv"><span class="k">Week</span><span class="v" id="op-week">—</span></div>
    </div>
    <div class="footer-note">
      Click-through prototype.<br>
      Changes persist in your browser.
      <div class="footer-tour-link">
        <a href="#" id="launch-tour">Take the tour →</a>
        <a href="#" id="reset-state" class="reset-link">Reset to seed</a>
      </div>
    </div>
  </aside>
  <main id="main"><!-- view rendered here --></main>
</div>
<div id="modal-root"></div>
<script src="data.js"></script>
<script src="shifts.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script>
</body>
</html>
