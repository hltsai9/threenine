# Example Secrets. Do NOT commit real values — create these out-of-band
# (kubectl create secret / sealed-secrets / external-secrets), this file is a template.
apiVersion: v1
kind: Secret
metadata:
  name: case-tracker-db
type: Opaque
stringData:
  # The ONE URL that selects your production database.
  DATABASE_URL: "postgresql+psycopg://cases:CHANGE_ME@postgres:5432/cases"
---
apiVersion: v1
kind: Secret
metadata:
  name: case-center-creds
type: Opaque
stringData:
  # Used ONLY by the ingestion CronJob — never by the API or the browser.
  CASE_CENTER_API_KEY: "CHANGE_ME"
  CASE_CENTER_COOKIE: "CHANGE_ME"
  CASE_CENTER_BASE_URL: "https://case-center.internal/case/"
