# Example Secrets. Do NOT commit real values — create these out-of-band
# (kubectl create secret / sealed-secrets / external-secrets), this file is a template.
apiVersion: v1
kind: Secret
metadata:
  name: case-tracker-db
  namespace: case-tracker
type: Opaque
stringData:
  # The ONE URL that selects your production database. Used by the API, the migrate
  # initContainer, and the ingest CronJob.
  DATABASE_URL: "postgresql+psycopg://cases:CHANGE_ME@postgres:5432/cases"  # checkov:skip=CKV_SECRET_4 placeholder in a template, not a real credential
---
apiVersion: v1
kind: Secret
metadata:
  name: case-tracker-api
  namespace: case-tracker
type: Opaque
stringData:
  # REQUIRED in production: the shared bearer token that gates /api/*. If this is empty/unset the
  # API is OPEN (anyone reachable can read case PII and purge cases). Operators sign in with it.
  # Generate one: `openssl rand -hex 32`
  API_AUTH_TOKEN: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: case-center-creds
  namespace: case-tracker
type: Opaque
stringData:
  # Used ONLY by the ingestion CronJob — never by the API or the browser.
  CASE_CENTER_API_KEY: "CHANGE_ME"
  CASE_CENTER_COOKIE: "CHANGE_ME"
  CASE_CENTER_BASE_URL: "https://case-center.internal/case/"
