# API service: stateless, horizontally scalable. Serves /api/* and the static SPA.
# An initContainer runs Alembic migrations before the app starts.
#
# NOTE on migrations + replicas: each pod runs the `migrate` initContainer, so with replicas > 1
# they call `alembic upgrade head` concurrently on a rollout. On a transactional-DDL database
# (PostgreSQL) this is safe — one transaction wins and the others find the version already at head
# and no-op. For stricter control, run migrations as a one-shot Job (or Helm pre-upgrade hook) and
# drop this initContainer. Either way AUTO_CREATE stays 0 so the app never creates tables itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-tracker-api
  namespace: case-tracker
  labels: { app: case-tracker-api }
  annotations:
    # Accepted deviations, documented for the IaC scanner:
    checkov.io/skip1: CKV_K8S_35=DATABASE_URL/API_AUTH_TOKEN are consumed as env vars by design (12-factor app); no file-mount reader exists
    checkov.io/skip2: CKV_K8S_43=the pipeline pins an immutable, image-scanned tag via kustomize; digest pinning would break kustomize edit set image
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime rollout
  selector:
    matchLabels: { app: case-tracker-api }
  template:
    metadata:
      labels: { app: case-tracker-api }
    spec:
      # No pod here talks to the Kubernetes API — don't mount a token it could leak.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # high UID: can't collide with a host user (matches the image's `app` user)
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          # `set-by-pipeline` is a placeholder: the Azure DevOps deploy stage pins the real
          # registry + immutable tag via kustomize (see kustomization.yaml) after the image scan.
          image: case-tracker-api:set-by-pipeline
          imagePullPolicy: Always
          workingDir: /app/backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: { name: case-tracker-db }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: api
          image: case-tracker-api:set-by-pipeline   # pinned by the pipeline (kustomize) — see above
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef: { name: case-tracker-db }    # DATABASE_URL
            - secretRef: { name: case-tracker-api }    # API_AUTH_TOKEN (gates /api/*)
          env:
            - { name: AUTO_CREATE, value: "0" }
            - { name: SERVE_STATIC, value: "1" }
          # /healthz is unauthenticated by design — safe to probe even when API_AUTH_TOKEN is set.
          # (Probing /api/cases would 401 once auth is on and the pod would never become Ready.)
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30      # allow up to ~150s for a cold start
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: case-tracker-api
  namespace: case-tracker
spec:
  selector: { app: case-tracker-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Keep at least one pod serving during voluntary disruptions (node drains, rollouts).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: case-tracker-api
  namespace: case-tracker
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: case-tracker-api }
