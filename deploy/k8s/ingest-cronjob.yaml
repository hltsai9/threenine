# Ingestion CronJob: refreshes the DB from Case Center on a schedule. This is the
# only workload that mounts the Case Center credentials.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: case-tracker-ingest
spec:
  schedule: "*/5 * * * *"            # every 5 minutes — tune to taste
  concurrencyPolicy: Forbid          # don't overlap runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: case-tracker-ingest:latest
              args: ["python", "-m", "backend.ingest", "--hours", "6"]
              envFrom:
                - secretRef: { name: case-tracker-db }      # DATABASE_URL
                - secretRef: { name: case-center-creds }     # CC API key + cookie
              env:
                - name: AUTO_CREATE
                  value: "0"
