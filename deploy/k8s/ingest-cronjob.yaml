# Ingestion CronJob: refreshes the DB from Case Center on a schedule. This is the
# only workload that mounts the Case Center credentials.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: case-tracker-ingest
  namespace: case-tracker
  annotations:
    # Accepted deviations, documented for the IaC scanner:
    checkov.io/skip1: CKV_K8S_35=DB URL + Case Center creds are consumed as env vars by design (12-factor app)
    checkov.io/skip2: CKV_K8S_43=the pipeline pins an immutable, image-scanned tag via kustomize
spec:
  schedule: "*/5 * * * *"            # every 5 minutes — tune to taste
  concurrencyPolicy: Forbid          # don't overlap runs
  startingDeadlineSeconds: 120       # skip (don't pile up) a run the scheduler missed
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600      # a run that hangs is killed, not left forever
      template:
        spec:
          restartPolicy: Never
          # Ingest never talks to the Kubernetes API — don't mount a token it could leak.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001    # high UID (matches the image's `app` user)
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: ingest
              # Placeholder tag — the Azure DevOps deploy stage pins the real registry +
              # immutable tag via kustomize (see kustomization.yaml) after the image scan.
              image: case-tracker-ingest:set-by-pipeline
              imagePullPolicy: Always
              args: ["python", "-m", "backend.ingest", "--hours", "6"]
              envFrom:
                - secretRef: { name: case-tracker-db }       # DATABASE_URL
                - secretRef: { name: case-center-creds }     # CC API key + cookie
              env:
                - { name: AUTO_CREATE, value: "0" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 256Mi }
          volumes:
            - { name: tmp, emptyDir: {} }
