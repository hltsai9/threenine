# Alembic config for the Case Tracker DB.
# The database URL is taken from the DATABASE_URL env var in alembic/env.py, so this
# file intentionally leaves sqlalchemy.url blank. Run from the backend/ folder:
#     alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = ..
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
